services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coordinator
      POSTGRES_PASSWORD: coordinator
      POSTGRES_DB: coordinator
    ports: ["5433:5432"]
    command: ["postgres", "-c", "log_statement=none"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coordinator"]
      interval: 2s
      timeout: 3s
      retries: 30
